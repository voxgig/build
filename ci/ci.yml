# CI for @voxgig/build: compile, run the generator suite with its coverage
# gate, and check that the committed dist/ matches the sources.
#
# DORMANT. This file is not active while it lives in ci/ - GitHub only runs
# workflows under .github/workflows/. See ci/README.md to activate.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install
        run: npm install --no-audit --no-fund

      - name: build
        run: npm run build

      # dist/ is COMMITTED here - projects overlay this package, so a stale
      # dist silently ships old behaviour downstream. If the build changed
      # it, the last commit was made without rebuilding.
      - name: dist is committed and current
        run: |
          # `git diff` alone ignores UNTRACKED files, so a newly emitted
          # dist/ file that was never committed would pass this check -
          # while `npm pack` ships it, because the manifest takes the
          # whole directory. `git status --porcelain` covers modified and
          # untracked together.
          DIRTY=$(git status --porcelain -- dist)
          if [ -n "$DIRTY" ]; then
            echo '::error::dist/ is not clean - run `npm run build` and commit the result'
            echo "$DIRTY"
            exit 1
          fi

      # `npm test` IS the coverage command (gate: lines 95, functions 85,
      # branches 78) and emits lcov. Kept as ONE script rather than a
      # separate test-cov copy, so the thresholds cannot drift between
      # what a developer runs and what CI enforces.
      - name: test
        run: npm test

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.lcov
          if-no-files-found: warn
