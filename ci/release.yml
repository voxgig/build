# Publish @voxgig/build to npm when a version tag is pushed.
#
# DORMANT. GitHub only runs workflows under .github/workflows/.
# Activating this needs an NPM_TOKEN repository secret - see ci/README.md.
#
# This exists because the local publish path (`npm run repo-publish`)
# requires the `aql` vault CLI and a logged-in npm session. Publishing
# from CI needs neither on any individual machine: the token lives in the
# repository's secrets, and a tag is the trigger.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Allows a dry run without tagging anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify only - do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      # dist/ is committed. If the build changes it, the tag points at a
      # tree whose committed output is stale - do not publish that.
      - name: dist is committed and current
        run: |
          if ! git diff --quiet -- dist; then
            echo '::error::build changed committed dist/ - tag points at a stale tree'
            git --no-pager diff --stat -- dist
            exit 1
          fi

      - name: test
        run: npm test

      # The tag and package.json must agree, or you publish a version
      # nobody can find from the git history.
      - name: tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - name: publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public --dry-run

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
